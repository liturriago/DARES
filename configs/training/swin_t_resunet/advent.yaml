data:
  source_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-deforestation-uda"
  target_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-deforestation-uda"
  batch_size: 8
  patch_size: 224
  num_workers: 4
  mean: [0.0, 0.0, 0.0, 0.0]
  std: [1.0, 1.0, 1.0, 1.0]
  use_augmentation: true
model:
  backbone: "swin_t"
  head: "resunet"
  in_channels: 4
  num_classes: 2
  pretrained: true
  dropout_rate: 0.1
training:
  method: "advent"
  epochs: 100
  lr: 0.0001
  weight_decay: 0.00001
  gamma: 0.94
  use_amp: true
  device: "cuda"
  seed: 42
  lambda_adv: 0.1
  lambda_entropy: 0.1
experiment:
  name: "swin_t_resunet_advent"
  version: 1
  output_dir: "outputs/swin_t_resunet/advent/experiment_1"
  save_results: true
