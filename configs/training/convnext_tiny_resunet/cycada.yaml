data:
  source_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-deforestation-uda"
  target_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-deforestation-uda"
  batch_size: 8
  patch_size: 224
  num_workers: 4
  mean: [0.0, 0.0, 0.0, 0.0]
  std: [1.0, 1.0, 1.0, 1.0]
  use_augmentation: true
model:
  backbone: "convnext_tiny"
  head: "resunet"
  in_channels: 4
  num_classes: 2
  pretrained: true
  dropout_rate: 0.1
training:
  method: "cycada"
  epochs: 10
  lr: 0.0001
  weight_decay: 0.00001
  gamma: 0.94
  use_amp: true
  device: "cuda"
  seed: 42
  warmup_epochs: 5
  lambda_pixel: 1.0
  lambda_feat: 1.0
  grad_clip: 5.0
  lambda_cycle: 1.0
  lambda_identity: 0.1
experiment:
  name: "convnext_tiny_resunet_cycada"
  version: 1
  output_dir: "outputs/convnext_tiny_resunet/cycada/experiment_1"
  save_results: true
