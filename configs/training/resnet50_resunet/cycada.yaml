data:
  source_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-uda/Source"
  target_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-uda/Target_Medium"
  target_variant: medium
  batch_size: 8
  patch_size: 224
  num_workers: 4
  mean: [0.0, 0.0, 0.0, 0.0]
  std: [1.0, 1.0, 1.0, 1.0]
  use_augmentation: true
model:
  backbone: "resnet50"
  head: "resunet"
  in_channels: 4
  num_classes: 2
  pretrained: true
  dropout_rate: 0.1
training:
  method: "cycada"
  epochs: 25
  lr: 0.0001
  weight_decay: 0.00001
  use_amp: true
  device: "cuda"
  seed: 42
  warmup_epochs: 2
  lambda_pixel: 1.0
  lambda_feat: 1.0
  grad_clip: 5.0
  lambda_cycle: 1.0
  lambda_identity: 0.1
experiment:
  name: "resnet50_resunet_cycada"
  version: 1
  output_dir: "outputs/resnet50_resunet/cycada/experiment_1"
  save_results: true
