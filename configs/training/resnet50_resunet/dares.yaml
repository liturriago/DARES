data:
  source_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-uda/Source"
  target_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-uda/Target_Medium"
  target_variant: medium
  batch_size: 8
  patch_size: 224
  num_workers: 4
  mean: [0.0, 0.0, 0.0, 0.0]
  std: [1.0, 1.0, 1.0, 1.0]
  use_augmentation: true
model:
  backbone: "resnet50"
  head: "resunet"
  in_channels: 4
  num_classes: 2
  pretrained: true
  dropout_rate: 0.1
training:
  method: "dares"
  epochs: 25
  lr: 0.0001
  weight_decay: 0.00001
  gamma: 0.94
  use_amp: true
  device: "cuda"
  seed: 42
  lambda_renyi: 0.03
  tau: 0.85
  n_max: 512
  sigma: "auto"
  alpha: 2
  grid_size: 8
  schedule_delta: 12
  warmup_epochs: 5
experiment:
  name: "resnet50_resunet_dares"
  version: 1
  output_dir: "outputs/resnet50_resunet/dares/experiment_1"
  save_results: true
