data:
  source_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-deforestation-uda"
  target_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-deforestation-uda"
  batch_size: 8
  patch_size: 224
  num_workers: 4
  mean: [0.0, 0.0, 0.0, 0.0]
  std: [1.0, 1.0, 1.0, 1.0]
  use_augmentation: true
model:
  backbone: "resnet50"
  head: "deeplabv3p"
  in_channels: 4
  num_classes: 2
  pretrained: true
  dropout_rate: 0.1
training:
  method: "cbst"
  epochs: 25
  lr: 0.0001
  weight_decay: 0.00001
  gamma: 0.94
  use_amp: true
  device: "cuda"
  seed: 42
  warmup_epochs: 5
  lambda_self: 1.0
  pseudo_threshold: 0.9
  pseudo_topk_ratio: 0.5
  n_self_training_rounds: 1
experiment:
  name: "resnet50_deeplabv3p_cbst"
  version: 1
  output_dir: "outputs/resnet50_deeplabv3p/cbst/experiment_1"
  save_results: true
