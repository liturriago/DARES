data:
  source_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-deforestation-uda"
  target_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-deforestation-uda"
  batch_size: 8
  patch_size: 224
  num_workers: 4
  mean: [0.0, 0.0, 0.0, 0.0]
  std: [1.0, 1.0, 1.0, 1.0]
  use_augmentation: true
model:
  backbone: "swin_t"
  head: "deeplabv3p"
  in_channels: 4
  num_classes: 2
  pretrained: true
  dropout_rate: 0.1
training:
  method: "dares"
  epochs: 10
  lr: 0.0001
  weight_decay: 0.00001
  gamma: 0.94
  use_amp: true
  device: "cuda"
  seed: 42
  lambda_renyi: 0.2
  tau: 0.8
  n_max: 1024
  sigma: "auto"
  alpha: 2
  grid_size: 16
  schedule_delta: 8
  warmup_epochs: 2
experiment:
  name: "swin_t_deeplabv3p_dares"
  version: 1
  output_dir: "outputs/swin_t_deeplabv3p/dares/experiment_1"
  save_results: true
