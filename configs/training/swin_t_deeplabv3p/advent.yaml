data:
  source_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-uda/Source"
  target_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-uda/Target_Medium"
  target_variant: medium
  batch_size: 8
  patch_size: 224
  num_workers: 4
  mean: [0.0, 0.0, 0.0, 0.0]
  std: [1.0, 1.0, 1.0, 1.0]
  use_augmentation: true
model:
  backbone: "swin_t"
  head: "deeplabv3p"
  in_channels: 4
  num_classes: 2
  pretrained: true
  dropout_rate: 0.1
training:
  method: "advent"
  epochs: 25
  lr: 0.0001
  weight_decay: 0.00001
  use_amp: false
  device: "cuda"
  seed: 42
  warmup_epochs: 2
  lambda_adv: 0.1
  lambda_entropy: 0.1
  grad_clip: 5.0
  lr_d: 0.00001
experiment:
  name: "swin_t_deeplabv3p_advent"
  version: 1
  output_dir: "outputs/swin_t_deeplabv3p/advent/experiment_1"
  save_results: true
