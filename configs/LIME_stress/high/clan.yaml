data:
  source_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-uda/Source"
  target_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-uda/Target_High"
  target_variant: high
  batch_size: 8
  patch_size: 224
  num_workers: 4
  mean: [0.0, 0.0, 0.0, 0.0]
  std: [1.0, 1.0, 1.0, 1.0]
  use_augmentation: true
model:
  backbone: "resnet50"
  head: "resunet"
  in_channels: 4
  num_classes: 2
  pretrained: true
  dropout_rate: 0.1
training:
  method: "clan"
  epochs: 25
  lr: 0.0001
  weight_decay: 0.00001
  use_amp: false
  device: "cuda"
  seed: 42
  warmup_epochs: 2
  lambda_clan: 0.1
  clan_threshold: 0.5
  grad_clip: 5.0
  lr_d: 0.00001
experiment:
  name: "resnet50_resunet_high_clan"
  version: 1
  output_dir: "outputs/LIME_stress/high/clan/experiment_1"
  save_results: true
