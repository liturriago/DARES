data:
  source_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-uda/Source"
  target_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-uda/Target_Low"
  target_variant: low
  batch_size: 8
  patch_size: 224
  num_workers: 4
  mean: [0.0, 0.0, 0.0, 0.0]
  std: [1.0, 1.0, 1.0, 1.0]
  use_augmentation: true
model:
  backbone: "resnet50"
  head: "resunet"
  in_channels: 4
  num_classes: 2
  pretrained: true
  dropout_rate: 0.1
training:
  method: "cbst"
  epochs: 25
  lr: 0.0001
  weight_decay: 0.00001
  use_amp: true
  device: "cuda"
  seed: 42
  warmup_epochs: 2
  lambda_self: 1.0
  pseudo_threshold: 0.9
  pseudo_topk_ratio: 0.5
  n_self_training_rounds: 1
experiment:
  name: "resnet50_resunet_low_cbst"
  version: 1
  output_dir: "outputs/LIME_stress/low/cbst/experiment_1"
  save_results: true