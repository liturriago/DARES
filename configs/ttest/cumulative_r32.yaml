data:
  source_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-uda/Source"
  target_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-uda/Target_Medium"
  target_variant: "medium"
  batch_size: 8
  patch_size: 224
  num_workers: 4
  mean: [0.0, 0.0, 0.0, 0.0]
  std: [1.0, 1.0, 1.0, 1.0]
  use_augmentation: false

model:
  backbone: "resnet50"
  head: "resunet"
  in_channels: 4
  num_classes: 2
  pretrained: false
  dropout_rate: 0.0

# R3-2 (cumulative ablation): paired per-patch Wilcoxon + Holm across the
# cumulative chain Source-Only -> +EM -> +EM+align -> +EM+align+AC -> +complete.
# Inference only: no retraining. Requires the new checkpoints to be uploaded
# to the Kaggle model dataset with the filenames used below.
ttest:
  test: "wilcoxon"
  alpha: 0.05
  min_samples: 8
  alternative: "two-sided"
  splits: ["target_test", "source_test"]
  metrics: ["miou", "dice"]
  output_dir: "reports/ttest/cumulative_r32"
  models:
    source_only: "/kaggle/input/models/lucasiturriago/dares/pytorch/default/1/source_only.pth"
    em_only: "/kaggle/input/models/lucasiturriago/dares/pytorch/default/1/dares_em_only.pth"
    align_only: "/kaggle/input/models/lucasiturriago/dares/pytorch/default/1/dares_align_only.pth"
    em_align: "/kaggle/input/models/lucasiturriago/dares/pytorch/default/1/dares_em_align.pth"
    em_align_ac: "/kaggle/input/models/lucasiturriago/dares/pytorch/default/1/dares_em_align_ac.pth"
    complete: "/kaggle/input/models/lucasiturriago/dares/pytorch/default/1/dares.pth"
  comparisons:
    - ["source_only", "em_only"]
    - ["source_only", "align_only"]
    - ["em_only", "em_align"]
    - ["align_only", "em_align"]
    - ["em_align", "em_align_ac"]
    - ["em_align_ac", "complete"]
    - ["source_only", "complete"]
