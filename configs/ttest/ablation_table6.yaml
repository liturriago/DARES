data:
  source_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-uda/Source"
  target_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-uda/Target_Medium"
  target_variant: "medium"
  batch_size: 8
  patch_size: 224
  num_workers: 4
  mean: [0.0, 0.0, 0.0, 0.0]
  std: [1.0, 1.0, 1.0, 1.0]
  use_augmentation: false

model:
  backbone: "resnet50"
  head: "resunet"
  in_channels: 4
  num_classes: 2
  pretrained: false
  dropout_rate: 0.0

ttest:
  test: "wilcoxon"
  alpha: 0.05
  min_samples: 8
  alternative: "two-sided"
  splits: ["target_test", "source_test"]
  metrics: ["miou", "dice"]
  output_dir: "reports/ttest/ablation_table6"
  models:
    complete: "outputs/LIME_stress/medium/dares/experiment_1/model_final.pth"
    no_align: "outputs/ablation/dares_no_align/experiment_1/model_final.pth"
    no_anticollapse: "outputs/ablation/dares_no_anti_collapse/experiment_1/model_final.pth"
    no_repulsion: "outputs/ablation/dares_no_repulsion/experiment_1/model_final.pth"
    no_em: "outputs/ablation/dares_no_em/experiment_1/model_final.pth"
  comparisons:
    - ["complete", "no_align"]
    - ["complete", "no_anticollapse"]
    - ["complete", "no_repulsion"]
    - ["complete", "no_em"]
    - ["no_align", "no_anticollapse"]
    - ["no_align", "no_repulsion"]
    - ["no_align", "no_em"]
    - ["no_anticollapse", "no_repulsion"]
    - ["no_anticollapse", "no_em"]
    - ["no_repulsion", "no_em"]
