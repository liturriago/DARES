data:
  source_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-uda/Source"
  target_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-uda/Target_Medium"
  target_variant: "medium"
  batch_size: 8
  patch_size: 224
  num_workers: 4
  mean: [0.0, 0.0, 0.0, 0.0]
  std: [1.0, 1.0, 1.0, 1.0]
  use_augmentation: false

model:
  backbone: "resnet50"
  head: "resunet"
  in_channels: 4
  num_classes: 2
  pretrained: false
  dropout_rate: 0.0

ttest:
  test: "wilcoxon"
  alpha: 0.05
  min_samples: 8
  alternative: "two-sided"
  splits: ["target_test", "source_test"]
  metrics: ["miou", "dice"]
  output_dir: "reports/ttest/baselines_table3"
  models:
    dares: "outputs/LIME_stress/medium/dares/experiment_1/model_final.pth"
    source_only: "outputs/LIME_stress/medium/source_only/experiment_1/model_final.pth"
    advent: "outputs/LIME_stress/medium/advent/experiment_1/model_final.pth"
    cbst: "outputs/LIME_stress/medium/cbst/experiment_1/model_final.pth"
  comparisons:
    - ["dares", "source_only"]
    - ["dares", "advent"]
    - ["dares", "cbst"]
