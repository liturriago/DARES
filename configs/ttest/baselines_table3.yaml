data:
  source_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-uda/Source"
  target_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-uda/Target_Medium"
  target_variant: "medium"
  batch_size: 8
  patch_size: 224
  num_workers: 4
  mean: [0.0, 0.0, 0.0, 0.0]
  std: [1.0, 1.0, 1.0, 1.0]
  use_augmentation: false

model:
  backbone: "resnet50"
  head: "resunet"
  in_channels: 4
  num_classes: 2
  pretrained: false
  dropout_rate: 0.0

ttest:
  test: "wilcoxon"
  alpha: 0.05
  min_samples: 8
  alternative: "two-sided"
  splits: ["target_test", "source_test"]
  metrics: ["miou", "dice"]
  output_dir: "reports/ttest/baselines_table3"
  models:
    dares: "/kaggle/input/models/lucasiturriago/dares/pytorch/default/1/dares.pth"
    source_only: "/kaggle/input/models/lucasiturriago/dares/pytorch/default/1/source_only.pth"
    advent: "/kaggle/input/models/lucasiturriago/dares/pytorch/default/1/advent.pth"
    cbst: "/kaggle/input/models/lucasiturriago/dares/pytorch/default/1/cbst.pth"
  comparisons:
    - ["dares", "source_only"]
    - ["dares", "advent"]
    - ["dares", "cbst"]
