data:
  source_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-uda/Source"
  target_dir: "/kaggle/input/datasets/lucasiturriago/dares-amazon-uda/Target_Medium"
  target_variant: medium
  batch_size: 8
  patch_size: 224
  num_workers: 4
  mean: [0.0, 0.0, 0.0, 0.0]
  std: [1.0, 1.0, 1.0, 1.0]
  use_augmentation: true
model:
  backbone: "convnext_tiny"
  head: "resunet"
  in_channels: 4
  num_classes: 2
  pretrained: true
  dropout_rate: 0.1
training:
  method: "dares"
  epochs: 25
  lr: 0.0001
  weight_decay: 0.00001
  use_amp: true
  device: "cuda"
  seed: 42
  warmup_epochs: 2
  quota: 256
  min_samples: 8
  lambda_max: 1.0
  beta: 1.0
  repulsion_gamma: 0.0
  eta_floor: 1.0
  entropy_gap: 0.25
  repulsion_margin: 0.2
  warmup_steps: 1000
  ramp_steps: 4000
  ramp_delta: 10.0
  grad_ratio: 0.8
  trust_region: false
  ema_decay: 0.9
  align_form: "ce"
  use_renyi_em: true
  lambda_em: 0.05
experiment:
  name: "dares_no_repulsion"
  version: 1
  output_dir: "outputs/ablation/dares_no_repulsion/experiment_1"
  save_results: true
